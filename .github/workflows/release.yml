name: Release (APK oficial)

# Cria um GitHub Release com o APK assinado.
# Dispara ao criar uma tag "vX.Y.Z" (igual a VERSION_NAME em version.properties)
# ou manualmente (aba Actions → Release → Run workflow), estando no branch principal.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versão
        run: |
          VERSION=$(grep VERSION_NAME version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não bate com VERSION_NAME=${VERSION} em version.properties"
            exit 1
          fi

      - name: Keystore de assinatura
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=sim" >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets de assinatura não configurados: o APK será assinado com a chave de DEBUG."
            echo "SIGNED=nao" >> "$GITHUB_ENV"
          fi

      - name: Testes e APK release
        run: ./gradlew :core:test :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: Preparar arquivos
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/release/app-release.apk "saida/VaiDeBuzao-v${VERSION}.apk"
          (cd saida && sha256sum "VaiDeBuzao-v${VERSION}.apk" > "VaiDeBuzao-v${VERSION}.apk.sha256")
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notas.md
          {
            echo ""
            echo "---"
            echo "**Como instalar:** baixe o arquivo \`VaiDeBuzao-v${VERSION}.apk\` abaixo pelo celular e siga o guia [COMO-INSTALAR](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/COMO-INSTALAR.md)."
            if [ "$SIGNED" = "nao" ]; then
              echo ""
              echo "> ⚠️ Este APK foi assinado com a chave de **debug** (secrets de assinatura ainda não configurados)."
            fi
          } >> notas.md

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" saida/* --clobber
          else
            gh release create "$TAG" saida/* --title "Vai de Buzão ${TAG}" --notes-file notas.md --target "$GITHUB_SHA"
          fi
