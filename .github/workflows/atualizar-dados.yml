name: Atualizar dados de ônibus

# Baixa pontos e linhas do OpenStreetMap (ou usa GTFS em data/gtfs/*.zip),
# gera app/src/main/assets/transit.db e o relatório docs/dados-relatorio.md, e faz commit.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 1 * *" # todo dia 1º do mês, 06:17 em Cuiabá
  push:
    paths:
      - "tools/data/**"
      - "data/gtfs/**"
      - "data/linhas/**"
      - ".github/workflows/atualizar-dados.yml"

permissions:
  contents: write

concurrency:
  group: dados-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes do pipeline
        run: python3 -m unittest discover -s tools/data/tests -v

      - name: Gerar banco de dados
        run: python3 tools/data/gerar_transit_db.py

      - name: Commit dos dados (se mudaram)
        run: |
          git config user.name "vai-de-buzao-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/transit.db docs/dados-relatorio.md
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "dados: atualiza pontos e linhas de ônibus ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
