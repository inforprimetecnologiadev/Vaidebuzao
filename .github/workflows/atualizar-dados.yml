name: Atualizar dados de ônibus

# Baixa pontos e linhas do OpenStreetMap (ou usa GTFS em data/gtfs/*.zip),
# gera app/src/main/assets/transit.db e o relatório docs/dados-relatorio.md, e faz commit.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 1 * *" # todo dia 1º do mês, 06:17 em Cuiabá
  push:
    paths:
      - "tools/data/**"
      - "data/gtfs/**"
      - "data/linhas/**"
      - ".github/workflows/atualizar-dados.yml"

permissions:
  contents: write

concurrency:
  group: dados-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes do pipeline
        run: python3 -m unittest discover -s tools/data/tests -v

      - name: Gerar banco de dados
        run: python3 tools/data/gerar_transit_db.py

      - name: Commit dos dados (se mudaram)
        run: |
          git config user.name "vai-de-buzao-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/novo"
          cp app/src/main/assets/transit.db docs/dados-relatorio.md "$RUNNER_TEMP/novo/"
          for i in 1 2 3 4; do
            # parte sempre da versão mais nova do branch (evita conflito com outra execução)
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            cp "$RUNNER_TEMP/novo/transit.db" app/src/main/assets/transit.db
            cp "$RUNNER_TEMP/novo/dados-relatorio.md" docs/dados-relatorio.md
            # compara o conteúdo (sem a tabela meta): só commita se os dados mudaram
            OLD=$(git show "HEAD:app/src/main/assets/transit.db" > "$RUNNER_TEMP/antigo.db" 2>/dev/null && python3 tools/data/hash_dados.py "$RUNNER_TEMP/antigo.db" || echo nenhum)
            NEW=$(python3 tools/data/hash_dados.py "$RUNNER_TEMP/novo/transit.db")
            if [ "$OLD" = "$NEW" ]; then
              echo "Os dados não mudaram."
              exit 0
            fi
            git add app/src/main/assets/transit.db docs/dados-relatorio.md
            git commit -q -m "dados: atualiza pontos e linhas de ônibus ($(date -u +%Y-%m-%d))"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
